[template.environment]
  GQL_HOST = "WordPress URL http://example.com"
  NUXT_IMAGE_DOMAINS = "Comma separated list of domains. example.com,example2.com"
  # Netlify Image CDN transforms local and remote images at the edge.
  NUXT_IMAGE_PROVIDER = "netlify"

[build]
  # Critical for static hosting: publish .output/public with the hashed /_nuxt bundle.
  command = "NITRO_PRESET=static npm run generate"
  publish = ".output/public"

[images]
  # Repclace with your own domain to allow remote images to be optimized
  remote_images = ["https://.*"]
