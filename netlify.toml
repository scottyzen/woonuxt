[template.environment]
  GQL_HOST = "WordPress URL http://example.com"
  NUXT_IMAGE_DOMAINS = "Comma separated list of domains. example.com,example2.com"
  # Optional. Leave unset for the safe 'none' provider. Never use 'ipx' here — it requires a running Nuxt server and breaks static hosting.
  NUXT_IMAGE_PROVIDER = "netlify"

[build]
  # Critical for static hosting: publishes .output/public (with the hashed /_nuxt bundle), not dist. `nuxt generate` always targets a static preset on its own.
  command = "npm run generate"
  publish = ".output/public"

[images]
  # Repclace with your own domain to allow remote images to be optimized
  remote_images = ["https://.*"]
